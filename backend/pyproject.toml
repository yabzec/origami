[project]
name = "origami-backend"
version = "0.1.0"
requires-python = ">=3.10, <3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "litellm>=1.60",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "pypdf>=5.1",
    "pdf2image>=1.17",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0",
    "transformers>=4.44,<5",
    "torch>=2.4",
    "einops>=0.8",
    "accelerate>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: loads real ML model weights from disk/network; deselected by default, run with -m slow",
]
filterwarnings = [
    # Upstream FastAPI TestClient uses deprecated httpx API; tracked for removal when FastAPI updates TestClient
    "ignore:Using.*httpx.*with.*starlette.testclient.*is deprecated",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
