[project]
name = "origami-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "litellm>=1.60",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "pypdf>=5.1",
    "pdf2image>=1.17",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Upstream FastAPI TestClient uses deprecated httpx API; tracked for removal when FastAPI updates TestClient
    "ignore:Using.*httpx.*with.*starlette.testclient.*is deprecated",
]
