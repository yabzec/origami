services:
  db:
    container_name: origami-db
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: origami
      POSTGRES_PASSWORD: origami
      POSTGRES_DB: origami
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origami"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    container_name: origami-ollama
    image: ollama/ollama:0.20.4
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 5m  # unload the model after 5 idle minutes
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
